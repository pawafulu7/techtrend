version: '3.8'

services:
  postgres:
    build:
      context: .
      dockerfile: Dockerfile.postgres-pgvector
    image: techtrend-postgres-pgvector:latest
    container_name: techtrend-postgres
    environment:
      POSTGRES_DB: techtrend_dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=ja_JP.UTF-8"
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/migration/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: techtrend-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_dev_password}
      --maxmemory 400mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_dev_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  postgres_data:
    name: techtrend_postgres_data
  redis_data:
    name: techtrend_redis_data

networks:
  default:
    external: true
    name: techtrend_network