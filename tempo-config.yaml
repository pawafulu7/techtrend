server:
  http_listen_port: 3200

distributor:
  receivers:
    otlp:
      protocols:
        grpc:
        http:

storage:
  trace:
    backend: local
    wal:
      path: /tmp/tempo/wal
    local:
      path: /tmp/tempo/blocks

metrics_generator:
  registry:
    collection_interval: 1m
  storage:
    path: /tmp/tempo/metrics
  processor:
    service_graphs: {}
    span_metrics: {}

compactor:
  compaction:
    block_retention: 24h
