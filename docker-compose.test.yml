services:
  postgres-test:
    image: postgres:15-alpine
    container_name: techtrend-postgres-test
    environment:
      POSTGRES_DB: techtrend_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"

  redis-test:
    image: redis:7-alpine
    container_name: techtrend-redis-test
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"

  node-ci:
    build:
      context: .
      dockerfile: Dockerfile.test
    container_name: techtrend-node-ci
    working_dir: /app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres-test:5432/techtrend_test
      REDIS_URL: redis://redis-test:6379
      NODE_ENV: test
      CI: true
    init: true
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - default

  playwright-e2e:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    container_name: techtrend-playwright-e2e
    working_dir: /app
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD}@postgres-test:5432/techtrend_test
      REDIS_URL: redis://redis-test:6379
      BASE_URL: http://localhost:3000
      NODE_ENV: test
      CI: true
    shm_size: "2gb"
    init: true
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - default

volumes:
  postgres_test_data:
    name: techtrend_postgres_test_data
  redis_test_data:
    name: techtrend_redis_test_data

networks:
  default:
    name: techtrend_test_network
