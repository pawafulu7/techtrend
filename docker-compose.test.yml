x-common-logging: &common-logging
  driver: "json-file"
  options:
    max-size: "10m"
    max-file: "3"

x-common-test-env: &common-test-env
  DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres_test_password}@postgres-test:5432/techtrend_test
  TEST_DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:-postgres_test_password}@postgres-test:5432/techtrend_test
  REDIS_URL: redis://:${REDIS_PASSWORD:-redis_test_password}@redis-test:6379
  NODE_ENV: test
  CI: "true"
  POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_test_password}
  GEMINI_API_KEY: ${GEMINI_API_KEY}
  AUTH_SECRET: ${AUTH_SECRET:-test-secret-key-for-testing-only-32-chars}
  NEXTAUTH_SECRET: ${NEXTAUTH_SECRET:-test-secret-key-for-testing-only-32-chars}
  PRISMA_MIGRATION_ENGINE_SKIP_TRANSACTIONS: "1"

services:
  postgres-test:
    build:
      context: .
      dockerfile: Dockerfile.postgres-pgvector
    image: techtrend-postgres-pgvector:latest
    container_name: techtrend-postgres-test
    environment:
      POSTGRES_DB: techtrend_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_test_password}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8 --locale=ja_JP.UTF-8"
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
      - ./scripts/docker/init-pgvector-test.sql:/docker-entrypoint-initdb.d/init-pgvector.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *common-logging
    restart: "no"

  redis-test:
    image: redis:7-alpine
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-redis_test_password}
      --maxmemory 400mb
      --maxmemory-policy allkeys-lru
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-redis_test_password}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    logging: *common-logging
    restart: "no"

  node-ci:
    build:
      context: .
      dockerfile: Dockerfile.test
    working_dir: /app
    environment:
      <<: *common-test-env
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-test-github-client-id}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-test-github-client-secret}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-test-google-client-id}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-test-google-client-secret}
    logging: *common-logging
    init: true
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - default

  playwright-e2e:
    build:
      context: .
      dockerfile: Dockerfile.playwright
    working_dir: /app
    environment:
      <<: *common-test-env
      BASE_URL: http://localhost:3000
      NEXT_PUBLIC_ENABLE_AI_SEARCH: "true"
    volumes:
      - ./__tests__:/app/__tests__:ro
      - ./e2e:/app/e2e:ro
      - ./playwright.config.ts:/app/playwright.config.ts:ro
    shm_size: "2gb"
    logging: *common-logging
    init: true
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - default

volumes:
  postgres_test_data:
    name: techtrend_postgres_test_data
  redis_test_data:
    name: techtrend_redis_test_data

networks:
  default:
    name: techtrend_test_network
