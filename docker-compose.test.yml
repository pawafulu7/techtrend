services:
  postgres-test:
    image: postgres:15-alpine
    container_name: techtrend-postgres-test
    environment:
      POSTGRES_DB: techtrend_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_INITDB_ARGS: "--encoding=UTF-8"
    ports:
      - "127.0.0.1:5434:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"

  redis-test:
    image: redis:7-alpine
    container_name: techtrend-redis-test
    ports:
      - "6380:6379"
    volumes:
      - redis_test_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: "no"

  node-ci:
    image: node:20-alpine
    container_name: techtrend-node-ci
    working_dir: /app
    env_file:
      - .env
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ./:/app
      # 名前付きボリュームで隔離（優先順位を高くする）
      - node_ci_modules:/app/node_modules
      - node_ci_next:/app/.next
      - node_ci_coverage:/app/coverage
      - node_ci_test_results:/app/test-results
      - node_ci_playwright_report:/app/playwright-report
      - node_ci_tmp:/app/tmp
      - node_ci_cache:/app/.cache
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - default

  playwright-e2e:
    image: mcr.microsoft.com/playwright:v1.55.0-jammy
    container_name: techtrend-playwright-e2e
    working_dir: /app
    env_file:
      - .env
    environment:
      HOST_UID: ${HOST_UID:-1000}
      HOST_GID: ${HOST_GID:-1000}
    volumes:
      - ./:/app
      # 名前付きボリュームで隔離（優先順位を高くする）
      - playwright_modules:/app/node_modules
      - playwright_next:/app/.next
      - playwright_test_results:/app/test-results
      - playwright_report:/app/playwright-report
      - playwright_tmp:/app/tmp
      - playwright_cache:/app/.cache
    depends_on:
      postgres-test:
        condition: service_healthy
      redis-test:
        condition: service_healthy
    networks:
      - default

volumes:
  postgres_test_data:
    name: techtrend_postgres_test_data
  redis_test_data:
    name: techtrend_redis_test_data
  # node-ci用ボリューム
  node_ci_modules:
  node_ci_next:
  node_ci_coverage:
  node_ci_test_results:
  node_ci_playwright_report:
  node_ci_tmp:
  node_ci_cache:
  # playwright-e2e用ボリューム
  playwright_modules:
  playwright_next:
  playwright_test_results:
  playwright_report:
  playwright_tmp:
  playwright_cache:

networks:
  default:
    name: techtrend_test_network
