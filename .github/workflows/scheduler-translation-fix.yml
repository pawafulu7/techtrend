name: Scheduler - Translation Fix (4-Hourly)

on:
  schedule:
    - cron: '30 */4 * * *' # Every 4 hours at minute 30
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'YES' to confirm manual execution"
        required: true
        type: string
        default: "NO"

concurrency:
  group: techtrend-scheduler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  translation-fix:
    if: github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'YES')
    runs-on: ubuntu-latest
    # 10 件ごとに 60 秒待つので、100 件余りで 15 分ほどかかる。API が遅い日や、障害の後に
    # 対象が溜まった回でも打ち切られないよう 60 分にする（打ち切られると集計と終了コードが出ない）
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - name: Scheduler setup
        uses: ./.github/actions/scheduler-setup
        with:
          database_url: ${{ secrets.DATABASE_URL }}
      - name: Fix missing translations
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          # GEMINI_MODEL は指定しない。毎時の要約で訳すときと同じ既定のモデル（lib/di/config.ts）を使う。
          # 固定していた gemini-2.0-flash-lite は提供が終わり、全件 404 で失敗していた
          # 翻訳の有効・無効は ENABLE_TITLE_TRANSLATION で決まる（lib/di/config.ts）。
          # 以前の TRANSLATION_ENABLED はどこからも読まれていなかった
          ENABLE_TITLE_TRANSLATION: 'true'
        run: |
          echo "Starting translation fix process..."
          npx tsx scripts/scheduled/fix-missing-translations.ts
          echo "Translation fix completed."
      - name: Notify failure to Slack
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              -d "{\"text\":\"[TechTrend] ${{ github.workflow }} failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
