name: Scheduler - Daily Trend Report

on:
  schedule:
    - cron: '30 5 * * *' # Daily 14:30 JST (UTC 05:30)
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'YES' to confirm manual execution"
        required: true
        type: string
        default: "NO"
      type:
        description: "Report type (daily/weekly/monthly)"
        required: false
        type: choice
        options:
          - daily
          - weekly
          - monthly
        default: "daily"
      date:
        description: "Target date (YYYY-MM-DD, optional)"
        required: false
        type: string

concurrency:
  group: techtrend-scheduler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-trend-report:
    if: github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'YES')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Scheduler setup
        uses: ./.github/actions/scheduler-setup
        with:
          database_url: ${{ secrets.DATABASE_URL }}
      - name: Generate trend report
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TYPE="${{ github.event.inputs.type || 'daily' }}"
          DATE="${{ github.event.inputs.date }}"

          if [ -n "$DATE" ]; then
            npx tsx scripts/scheduled/generate-trend-report.ts --type "$TYPE" --date "$DATE"
          else
            npx tsx scripts/scheduled/generate-trend-report.ts --type "$TYPE"
          fi
      - name: Notify failure to Slack
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              -d "{\"text\":\"[TechTrend] ${{ github.workflow }} failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
