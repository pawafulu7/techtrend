name: Scheduler - Daily Trend Report

on:
  schedule:
    - cron: '30 5 * * *' # Daily 14:30 JST (UTC 05:30)
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'YES' to confirm manual execution"
        required: true
        type: string
        default: "NO"
      type:
        description: "Report type (daily/weekly/monthly)"
        required: false
        type: choice
        options:
          - daily
          - weekly
          - monthly
        default: "daily"
      date:
        description: "Target date (YYYY-MM-DD, optional)"
        required: false
        type: string

concurrency:
  group: techtrend-scheduler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  generate-trend-report:
    if: github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'YES')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Warm up database connection
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "SELECT 1;" | npx prisma db execute --stdin --url "$DATABASE_URL"
      - name: Apply DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PRISMA_MIGRATE_ENGINE_ADVISORY_LOCK_TIMEOUT: 60000
        run: npx prisma migrate deploy
      - name: Generate trend report
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          TYPE="${{ github.event.inputs.type || 'daily' }}"
          DATE="${{ github.event.inputs.date }}"

          if [ -n "$DATE" ]; then
            npx tsx scripts/scheduled/generate-trend-report.ts --type "$TYPE" --date "$DATE"
          else
            npx tsx scripts/scheduled/generate-trend-report.ts --type "$TYPE"
          fi
