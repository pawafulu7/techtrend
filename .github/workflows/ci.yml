name: CI

on:
  push:
    branches: [main, develop, 'feature/**']
  pull_request:
    branches: [main, develop]

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    
    strategy:
      fail-fast: false
      matrix:
        node-version: [20.x]
    
    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: techtrend_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d techtrend_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;"
          PGPASSWORD=postgres psql -h localhost -U postgres -d techtrend_test \
            -c "SELECT extname, extversion FROM pg_extension WHERE extname = 'vector';"

      - name: Setup test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/techtrend_test
        run: |
          npx prisma generate
          npx prisma migrate deploy || npx prisma db push

      - name: Seed test database
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/techtrend_test
        run: |
          echo "Seeding test database..."
          npx tsx prisma/seed-test.ts
          echo "Seed completed successfully"

      - name: Run tests (node env only)
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/techtrend_test
          NEXTAUTH_SECRET: test-secret-key-for-testing-purposes-only-32chars
          NODE_ENV: test
        run: npm run test:coverage

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        if: matrix.node-version == '20.x'
        with:
          file: ./coverage/lcov.info
          flags: unittests
          name: codecov-umbrella


  lint:
    name: Lint
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run ESLint
        run: npm run lint

      - name: Check TypeScript
        run: npm run type-check

  build:
    name: Build
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: techtrend_test
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Enable pgvector extension
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d techtrend_test \
            -c "CREATE EXTENSION IF NOT EXISTS vector;" || echo "pgvector setup failed, continuing..."

      - name: Setup database for build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/techtrend_test
        run: |
          npx prisma generate
          npx prisma db push --accept-data-loss --skip-generate || echo "db push failed, continuing..."

      - name: Build application
        run: npm run build
        env:
          AUTH_SECRET: dummy-secret-for-ci-build-only-32-characters-long
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/techtrend_test
          OPENAI_API_KEY: sk-dummy-key-for-ci-build-only-not-used-at-build-time

      - name: Check build size
        run: |
          echo "Build size:"
          du -sh .next/
