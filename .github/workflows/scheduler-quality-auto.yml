name: Scheduler - Quality Check & Auto Regenerate

on:
  schedule:
    - cron: '30 6 * * *' # JST 15:30
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'YES' to confirm manual execution"
        required: true
        type: string
        default: "NO"

concurrency:
  group: techtrend-scheduler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-auto:
    if: github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'YES')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Scheduler setup
        uses: ./.github/actions/scheduler-setup
        with:
          database_url: ${{ secrets.DATABASE_URL }}
      - name: Run quality check and auto-regenerate
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npx tsx scripts/scheduled/quality-check.ts --days 7 --auto-regenerate
          npx tsx scripts/scheduled/auto-regenerate-low-quality.ts --threshold 70 --limit 10
      # 直近3日で要約の無い記事を補う（収集時の要約生成に失敗した記事。
      # 旧 pm2 scheduler.ts の 15:30 の処理を移した。issue #710）
      - name: Generate missing summaries
        if: ${{ !cancelled() }}
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: npx tsx scripts/scheduled/manage-summaries.ts missing --days 3 --batch 10
      - name: Notify failure to Slack
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              -d "{\"text\":\"[TechTrend] ${{ github.workflow }} failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
