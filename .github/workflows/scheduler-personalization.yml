name: Scheduler - Personalization Refresh

# 興味の分野の対応付け・重心・記事の点数を作り直す（scripts/scheduled/refresh-personalization.ts）。
# 新しく増えたタグを分野に対応付け、分野の重心を最近の記事に合わせる。新しい記事の点数は埋め込みのワーカーが書く
on:
  schedule:
    # 埋め込みのワーカー（毎時 0・30 分）と重ならない時刻にする
    - cron: '45 19 * * 0' # Every Sunday at 19:45 UTC (Monday 04:45 JST)
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'YES' to confirm manual execution"
        required: true
        type: string
        default: "NO"

concurrency:
  group: techtrend-scheduler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  refresh-personalization:
    if: github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'YES')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      # このジョブは checkout 後に git を使わないので、トークンを .git/config に残さない
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Scheduler setup
        uses: ./.github/actions/scheduler-setup
        with:
          database_url: ${{ secrets.DATABASE_URL }}
          skip_migrate: 'true'
      - name: Refresh interest categories and scores
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: npx tsx scripts/scheduled/refresh-personalization.ts
      - name: Notify failure to Slack
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              -d "{\"text\":\"[TechTrend] ${{ github.workflow }} failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
