name: Scheduler - Embedding Worker

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes (UTC)
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'YES' to confirm manual execution"
        required: true
        type: string
        default: "NO"

concurrency:
  group: techtrend-scheduler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  embedding-worker:
    if: github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'YES')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Warm up database connection
        shell: bash
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: |
          echo "SELECT 1;" | npx prisma db execute --stdin --url "$DATABASE_URL"
      - name: Run embedding worker
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBEDDING_WORKER_TIMEOUT_MS: 300000  # 5 minutes (GitHub Actions has 10 min limit)
          EMBEDDING_WORKER_BATCH_SIZE: 500     # Increased from 300 for better throughput
        run: npx tsx scripts/dev/run-embedding-worker.ts
