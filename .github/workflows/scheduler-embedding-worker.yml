name: Scheduler - Embedding Worker

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes (UTC)
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'YES' to confirm manual execution"
        required: true
        type: string
        default: "NO"

concurrency:
  group: techtrend-scheduler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  embedding-worker:
    if: github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'YES')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Scheduler setup
        uses: ./.github/actions/scheduler-setup
        with:
          database_url: ${{ secrets.DATABASE_URL }}
          skip_migrate: 'true'
      # 前回の実行が時間切れで止まり、PROCESSING のまま残ったジョブを PENDING に戻す
      # （ワーカー自体は拾い直さない。旧 pm2 scheduler.ts の毎時15分の処理を移した。issue #710）
      - name: Recover stuck embedding jobs
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: npx tsx scripts/maintenance/recover-stuck-embeddings.ts --age=30 --limit=100
      - name: Run embedding worker
        if: ${{ !cancelled() }}
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          EMBEDDING_WORKER_TIMEOUT_MS: 300000  # 5 minutes (GitHub Actions has 10 min limit)
          EMBEDDING_WORKER_BATCH_SIZE: 500     # Increased from 300 for better throughput
        run: npx tsx scripts/dev/run-embedding-worker.ts
      # 埋め込みの生成の後に、同じ出来事の記事をストーリーにまとめ直す（issue #723）。
      # ワーカーが時間切れで失敗しても、既にある埋め込みでまとめる
      - name: Assign stories
        if: ${{ !cancelled() }}
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: npx tsx scripts/scheduled/assign-stories.ts
      - name: Notify failure to Slack
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              -d "{\"text\":\"[TechTrend] ${{ github.workflow }} failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
