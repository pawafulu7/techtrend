name: AI Regression Test

on:
  pull_request:
    paths:
      - 'lib/ai/**'
      - 'lib/di/**'
      - 'lib/rag/embedding-service.ts'
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * 0' # Every Sunday at midnight

concurrency:
  group: ai-regression-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check if regression script exists
        id: check_script
        run: |
          if [ -f "scripts/ci/run-golden-set-regression.ts" ]; then
            echo "exists=true" >> $GITHUB_OUTPUT
          else
            echo "exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Run Golden Set Regression
        if: steps.check_script.outputs.exists == 'true'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NODE_ENV: test
        run: npx tsx scripts/ci/run-golden-set-regression.ts

      - name: Skip regression test (script not implemented yet)
        if: steps.check_script.outputs.exists == 'false'
        run: |
          echo "::warning::Regression script not yet implemented. Skipping test."
          echo "This is expected for WIP PR. Implementation in progress."

      - name: Upload regression report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: regression-report-${{ github.run_id }}
          path: |
            regression-report.json
            regression-report.md
          retention-days: 30

      - name: Comment PR with report (on failure)
        if: failure() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            if (fs.existsSync('regression-report.md')) {
              const report = fs.readFileSync('regression-report.md', 'utf8');
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## AI Regression Test Failed\n\n${report}`
              });
            } else {
              github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body: `## AI Regression Test Failed\n\nRegression report not available. See workflow logs for details.`
              });
            }
