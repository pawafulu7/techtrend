name: Scheduler - RSS Hourly

on:
  schedule:
    - cron: '0 * * * *' # Every hour (UTC)
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'YES' to confirm manual execution"
        required: true
        type: string
        default: "NO"

concurrency:
  group: techtrend-scheduler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rss-hourly:
    if: github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'YES')
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - name: Scheduler setup
        uses: ./.github/actions/scheduler-setup
        with:
          database_url: ${{ secrets.DATABASE_URL }}
      - name: Collect RSS sources and generate summaries
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SKIP_POST_SAVE_ENRICHMENT: '0'
          COLLECT_FEEDS_CONCURRENCY: '7'
          SLACK_NOTIFICATION_ENABLED: ${{ secrets.SLACK_NOTIFICATION_ENABLED }}
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          npx tsx scripts/scheduled/collect-feeds.ts \
            "はてなブックマーク" \
            "Zenn" \
            "Dev.to" \
            "Publickey" \
            "Stack Overflow Blog" \
            "Think IT" \
            "Rails Releases" \
            "AWS" \
            "SRE" \
            "Google Developers Blog" \
            "Hugging Face Blog" \
            "Hugging Face Papers" \
            "OpenAI Blog" \
            "Qiita AI" \
            "Zenn AI" \
            "Google AI Blog" \
            "InfoQ Japan" \
            "GitHub Blog" \
            "Cloudflare Blog" \
            "Mozilla Hacks" \
            "Hacker News" \
            "Medium Engineering" \
            "DeNA Engineering" \
            "CyberAgent Developers Blog" \
            "Mercari Engineering" \
            "LY Corporation Tech Blog" \
            "ZOZO TECH BLOG" \
            "Money Forward Developers Blog" \
            "SmartHR Tech Blog" \
            "Cookpad Tech Life" \
            "freee Developers Hub" \
            "Hatena Developer Blog" \
            "Sansan Builders Box" \
            "GMO Developers" \
            "ペパボテックブログ" \
            "NVIDIA Developer Blog" \
            "DeepMind Blog" \
            "DevelopersIO AWS" \
            "DevelopersIO AI" \
            "DevelopersIO Claude" \
            "DevelopersIO MCP" \
            "DevelopersIO Security" \
            "企業技術ブログ" \
            "Meta Engineering" \
            "Netflix TechBlog" \
            "Spotify Engineering" \
            "Pinterest Engineering" \
            "Stripe Engineering" \
            "Discord Engineering" \
            "Slack Engineering" \
            "The New Stack" \
            "CNCF Blog" \
            "Chrome Developers" \
            "Kubernetes Blog" \
            "Go Blog" \
            "Rust Blog" \
            "ITmedia Security" \
            "ITmedia AI+" \
            "@IT" \
            "Business Insider"
          # 要約生成はcollect-feeds.ts内で実行済み
          # 品質スコアと難易度計算は1日1回に移動 (scheduler-daily-quality.yml)
      - name: Notify failure to Slack
        if: failure()
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: |
          if [ -n "$SLACK_WEBHOOK_URL" ]; then
            curl -sf -X POST "$SLACK_WEBHOOK_URL" \
              -H 'Content-type: application/json' \
              -d "{\"text\":\"[TechTrend] ${{ github.workflow }} failed: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\"}"
          fi
