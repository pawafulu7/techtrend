name: Scheduler - RSS Hourly

on:
  schedule:
    - cron: '0 * * * *' # Every hour (UTC)
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type 'YES' to confirm manual execution"
        required: true
        type: string
        default: "NO"

concurrency:
  group: techtrend-scheduler-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rss-hourly:
    if: github.event_name != 'workflow_dispatch' || (github.event_name == 'workflow_dispatch' && github.event.inputs.confirm == 'YES')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
      - name: Install deps
        run: npm ci
      - name: Generate Prisma Client
        run: npx prisma generate
      - name: Apply DB migrations
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
        run: npx prisma migrate deploy
      - name: Collect RSS sources and generate summaries
        env:
          NODE_ENV: production
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npx tsx scripts/scheduled/collect-feeds.ts "はてなブックマーク" "Zenn" "Dev.to" "Publickey" "Stack Overflow Blog" "Think IT" "Rails Releases" "AWS" "SRE" "Google Developers Blog" "Hugging Face Blog" "Hugging Face Papers" "OpenAI Blog" "Qiita AI" "Zenn AI" "arXiv AI" "Google AI Blog" "InfoQ Japan" "GitHub Blog" "Cloudflare Blog" "Mozilla Hacks" "Hacker News" "Medium Engineering" "DeNA Engineering" "CyberAgent Developers Blog" "Mercari Engineering" "LY Corporation Tech Blog" "ZOZO TECH BLOG" "Money Forward Developers Blog" "SmartHR Tech Blog" "Cookpad Tech Life" "freee Developers Hub" "Hatena Developer Blog" "Sansan Builders Box" "GMO Developers" "ペパボテックブログ" "NVIDIA Developer Blog" "DeepMind Blog"
          npx tsx scripts/scheduled/manage-summaries.ts generate
          # 品質スコアと難易度計算は1日1回に移動 (scheduler-daily-quality.yml)
