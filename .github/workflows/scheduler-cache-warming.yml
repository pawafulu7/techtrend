name: Cache Warming (Scheduled)

on:
  schedule:
    # Every 10 minutes
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  warm-cache:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Trigger cache warming
        run: |
          curl -s -X POST "${{ secrets.APP_URL }}/api/cache/optimize" \
            -H "Content-Type: application/json" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            -d '{"action":"warm"}' \
            --max-time 120
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
