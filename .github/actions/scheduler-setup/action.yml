name: 'Scheduler Setup'
description: 'Common setup steps for scheduler workflows (Node.js, npm ci, Prisma generate, DB warm-up, optional migrate deploy)'

inputs:
  node_version:
    description: 'Node.js version'
    required: false
    default: '24'
  skip_migrate:
    description: 'Skip prisma migrate deploy step'
    required: false
    default: 'true'
  database_url:
    description: 'Database URL for DB warm-up and migration'
    required: true

runs:
  using: 'composite'
  steps:
    - uses: actions/setup-node@v7
      with:
        node-version: ${{ inputs.node_version }}
        cache: 'npm'
    - name: Set batch environment flags
      shell: bash
      # LOG_ERROR_DETAILS=false: Prisma の error ログと、lib/logger.ts が出す例外の message（DB に繋がらない
      # ときに接続先が入る）を公開ログに出さない
      run: |
        echo "ALLOW_INSECURE_AUTH_FALLBACK=true" >> "$GITHUB_ENV"
        echo "LOG_ERROR_DETAILS=false" >> "$GITHUB_ENV"
    - name: Install deps
      shell: bash
      run: |
        for attempt in 1 2 3; do
          npm ci && break
          if [ "$attempt" -lt 3 ]; then
            base_sleep=$((attempt * 10))
            jitter=$((RANDOM % 3))
            sleep_sec=$((base_sleep + jitter))
            [ "$sleep_sec" -gt 20 ] && sleep_sec=20
            echo "npm ci attempt $attempt/3 failed, retrying in ${sleep_sec}s..."
            sleep "${sleep_sec}"
          else
            echo "npm ci failed after 3 attempts"
            exit 1
          fi
        done
    - name: Generate Prisma Client
      shell: bash
      run: npx prisma generate
    - name: Warm up database connection
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database_url }}
      # 公開リポジトリのログに残るため、Prisma の生の出力（接続先が入る）は出さず、
      # 成否とエラーコードだけを出す（scripts/db/prod-db-env.sh の prod_db_run）
      run: |
        source scripts/db/prod-db-env.sh
        for attempt in 1 2 3 4 5; do
          echo "SELECT 1;" | prod_db_run npx prisma db execute --stdin && break
          if [ "$attempt" -lt 5 ]; then
            base_sleep=$((attempt * 10))
            jitter=$((RANDOM % 3))
            sleep_sec=$((base_sleep + jitter))
            [ "$sleep_sec" -gt 40 ] && sleep_sec=40
            echo "DB warm-up attempt $attempt/5 failed, retrying in ${sleep_sec}s..."
            sleep "${sleep_sec}"
          else
            echo "DB warm-up failed after 5 attempts"
            exit 1
          fi
        done
    - name: Apply DB migrations
      if: ${{ inputs.skip_migrate != 'true' }}
      shell: bash
      env:
        DATABASE_URL: ${{ inputs.database_url }}
      run: |
        source scripts/db/prod-db-env.sh
        for attempt in 1 2 3; do
          prod_db_run npx prisma migrate deploy && break
          if [ "$attempt" -lt 3 ]; then
            base_sleep=$((attempt * 15))
            jitter=$((RANDOM % 3))
            sleep_sec=$((base_sleep + jitter))
            [ "$sleep_sec" -gt 30 ] && sleep_sec=30
            echo "migrate deploy attempt $attempt/3 failed, retrying in ${sleep_sec}s..."
            sleep "${sleep_sec}"
          else
            echo "migrate deploy failed after 3 attempts"
            exit 1
          fi
        done
